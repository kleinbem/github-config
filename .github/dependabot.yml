version: 2
updates:
  # Provider versions and the committed .terraform.lock.hcl. `opentofu`, not
  # `terraform`: the root runs tofu and locks against registry.opentofu.org.
  # Majors come as one PR each, so a breaking one can be ignored alone.
  - package-ecosystem: opentofu
    directories: ["/"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
        update-types: [minor, patch]

  # Pinned actions, the tofu-setup composite action included.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/tofu-setup"]
    schedule:
      interval: weekly
    # Majors come as one PR each, so more than the default 5 can be due at
    # once, and Dependabot drops the ones over the limit without a word.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
