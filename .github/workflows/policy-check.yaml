name: Weekly Security Policy Check

on:
  schedule:
    # Run at 08:00 UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  audit-and-enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Audit Repositories
        env:
          # We use a custom PAT (POLICY_PAT) because the default GITHUB_TOKEN
          # only has access to the *current* repository.
          GITHUB_TOKEN: ${{ secrets.POLICY_PAT }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::POLICY_PAT secret is missing! Workflow cannot access other repos."
            exit 1
          fi
          python3 audit.py

      - name: Upload Policy Report
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: policy-report.json
          retention-days: 90
