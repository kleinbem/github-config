name: Terraform Plan (drift detection)

# Runs `tofu plan` against the shared R2 state to detect drift between the
# declared GitHub config and reality (e.g. a setting changed in the UI). Shared
# state means the signal is exact — `-detailed-exitcode` is 0 (no drift) or
# 2 (drift). Read-only: this workflow never applies. Apply happens on merge to
# main (terraform-apply.yaml); `just apply` is the local break-glass path.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC (before the governance report)
  pull_request:
    paths: ['**.tf']
  workflow_dispatch:

permissions:
  contents: read

env:
  # R2 remote-state backend — needed by every tofu state operation. GitHub
  # provider auth (TF_VAR_github_app_*) is wired by the tofu-setup composite
  # action from the APP_* secrets; the provider's `app_auth {}` then mints a
  # short-lived installation token (Administration + Issues + Metadata).
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tofu-setup
        with:
          app-id: ${{ secrets.APP_ID }}
          app-installation-id: ${{ secrets.APP_INSTALLATION_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: tofu plan
        run: |
          tofu plan -input=false -no-color -lock-timeout=120s -detailed-exitcode 2>&1 | tee plan.txt || ec=$?
          {
            echo "## tofu plan — github-config"
            case "${ec:-0}" in
              0) echo "✅ No drift — GitHub matches the declared config." ;;
              2) echo "⚠️ **Drift detected** — see the \`~\`/\`-\`/\`+\` lines below." ;;
              *) echo "❌ Plan errored." ;;
            esac
            echo '```'; tail -c 60000 plan.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${ec:-0}" = "1" ] && exit 1 || exit 0
