name: Terraform Plan (drift detection)

# Runs `tofu plan` to detect drift between the declared GitHub config and
# reality (e.g. a setting changed in the UI behind Terraform's back). Read-only
# — it never applies; apply stays a local, human-reviewed step (`just apply`).

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC (before the governance report)
  pull_request:
    paths: ['**.tf']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with Administration:read + Metadata:read on the managed
      # repos (read-only is enough to refresh + plan).
      TF_VAR_github_tf_token: ${{ secrets.TF_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        id: plan
        run: |
          set -o pipefail
          tofu plan -input=false -lock=false -no-color -detailed-exitcode 2>&1 | tee plan.txt || ec=$?
          # -detailed-exitcode: 0 = no changes, 2 = drift, 1 = error.
          echo "exit=${ec:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## tofu plan"
            if [ "${ec:-0}" = "2" ]; then echo "⚠️ **Drift detected** — declared config differs from GitHub."; fi
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${ec:-0}" = "1" ] && exit 1 || exit 0
