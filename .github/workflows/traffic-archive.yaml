name: Traffic Analytics Archiver

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Collect Traffic Data
        env:
          GITHUB_TOKEN: ${{ secrets.POLICY_PAT }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::POLICY_PAT secret is missing!"
            exit 1
          fi
          python3 scripts/traffic_collector.py

      - name: Commit and Push
        run: |
          git config user.name "Traffic Archiver"
          git config user.email "bot@github-config"
          
          git add traffic_data/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to traffic data."
          else
            git commit -m "chore: archive traffic data [skip ci]"
            git push
          fi
