name: Terraform Apply (GitOps deploy)

# Runs `tofu apply -auto-approve` against the shared R2 state when changes are
# pushed or merged to the default branch. This strictly enforces the GitOps
# deployment model: PRs are used to preview the plan, and merges apply it.

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      # R2 remote-state backend. GitHub provider auth is set from Actions
      # secrets in the step below (TF_VAR_github_app_*) — the provider's
      # `app_auth {}` mints a short-lived installation token (Administration +
      # Issues + Metadata on the managed repos).
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1

      - name: Configure GitHub App auth for the tofu provider
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_INSTALLATION_ID: ${{ secrets.APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          # provider `app_auth {}` reads these via TF_VAR_*; pem_file takes the
          # PEM contents, not a path. GITHUB_ENV masks multi-line secrets fine.
          {
            echo "TF_VAR_github_app_id=$APP_ID"
            echo "TF_VAR_github_app_installation_id=$APP_INSTALLATION_ID"
            echo "TF_VAR_github_app_pem<<__PEM_EOF__"
            printf '%s\n' "$APP_PRIVATE_KEY"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"

      - name: tofu init (R2 backend)
        run: |
          printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' \
            "$CLOUDFLARE_ACCOUNT_ID" > .r2-endpoint.hcl
          tofu init -input=false -backend-config=.r2-endpoint.hcl

      - name: tofu apply
        run: |
          tofu apply -auto-approve -input=false
