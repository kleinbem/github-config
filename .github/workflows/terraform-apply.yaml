name: Terraform Apply (GitOps deploy)

# Push to main (or a manual run) → plan → apply the exact saved plan, no re-plan.
# If the R2 state moved meanwhile, OpenTofu rejects the stale plan file.
# `just apply` is the local break-glass path.

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - .terraform.lock.hcl
  workflow_dispatch:
    inputs:
      allow-destroy:
        description: Apply even if the plan deletes resources or labels
        type: boolean
        default: false

# Latest wins within a group, so a superseded push never applies. Dispatches
# get their own group so one can't replace a pending push; the state lock and
# the saved-plan check cover runs from both groups.
concurrency:
  group: terraform-apply-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    # A manual run on another branch would apply unreviewed config.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The App and R2 secrets live in this environment, which only main can
    # deploy to (nix/infra github-secrets.tf). GitHub enforces that outside this
    # file, so a branch with an older workflow gets no credentials.
    environment: apply
    env:
      # R2 state backend. GitHub provider auth (TF_VAR_github_app_*) comes from
      # the tofu-setup action.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    permissions:
      contents: read
      pull-requests: read # the merged PR's labels, for the destroy gate
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      # Expression `==` ignores case, so a `Main` branch passes the job's `if`.
      - name: Main only
        run: '[ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Apply runs only from main, not $GITHUB_REF."; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tofu-setup
        with:
          app-id: ${{ secrets.APP_ID }}
          app-installation-id: ${{ secrets.APP_INSTALLATION_ID }}
          app-org-installation-id: ${{ secrets.APP_ORG_INSTALLATION_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: tofu plan
        id: plan
        run: |
          # Without pipefail `ec` is tee's status and a plan error passes.
          set -o pipefail
          tofu plan -input=false -no-color -lock-timeout=120s \
            -out=tfplan -detailed-exitcode 2>&1 | tee plan.txt || ec=$?
          # -detailed-exitcode only detects errors (1) here: with import blocks
          # in the plan it returns 0 even when there are real changes, so the
          # summary line decides instead. no-link: not reported upstream yet.
          if [ "${ec:-0}" = "1" ]; then
            note="❌ Plan errored."
          elif grep -qE '^(No changes\.|Plan: 0 to import, 0 to add, 0 to change, 0 to destroy\.)' plan.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            note="✅ No changes — nothing to apply."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            note="📝 Changes planned — applying the saved plan below."
          fi
          {
            echo "## tofu plan — github-config"
            echo "$note"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${ec:-0}" = "1" ] && exit 1 || exit 0

      # The plan applied here is made after the merge, so check it again: a
      # delete needs the allow-destroy label on the merged PR, or the
      # allow-destroy input on a manual run.
      - name: Gate deletes and replacements
        if: steps.plan.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          DISPATCH_ALLOW: ${{ inputs.allow-destroy }}
        run: |
          set -euo pipefail
          destructive=$(.github/scripts/destructive-changes.sh tfplan)
          if [ -z "$destructive" ]; then
            echo "No deletes, replacements or label removals."
            exit 0
          fi
          echo "$destructive"
          if [ "$EVENT" = workflow_dispatch ]; then
            allowed=$DISPATCH_ALLOW
          else
            allowed=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq 'any(.[]; any(.labels[]; .name == "allow-destroy"))')
          fi
          if [ "$allowed" = true ]; then
            echo "::warning::The plan deletes something; allowed by allow-destroy."
            exit 0
          fi
          echo "::error::The plan deletes something and its PR has no allow-destroy label. Apply by hand or rerun with allow-destroy."
          exit 1

      # The App key is an ephemeral variable (variables.tf), so the saved plan
      # doesn't carry it; the apply job supplies it again.
      - name: Upload saved plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: tfplan
          retention-days: 5
          if-no-files-found: error

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: apply
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download saved plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan

      - uses: ./.github/actions/tofu-setup
        with:
          app-id: ${{ secrets.APP_ID }}
          app-installation-id: ${{ secrets.APP_INSTALLATION_ID }}
          app-org-installation-id: ${{ secrets.APP_ORG_INSTALLATION_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: tofu apply (saved plan)
        run: |
          tofu apply -input=false -lock-timeout=120s -no-color tfplan
