name: Governance Report

# Weekly read-only governance pass: regenerate DASHBOARD.md and append traffic
# stats, then open a PR with them that auto-merges. Enforcement (settings,
# rulesets, labels) is not here: terraform-apply.yaml applies it.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The report covers every repo of the owner, so no repositories list;
          # read-only: administration for traffic, contents and issues for the rest.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-administration: read
          permission-contents: read
          permission-issues: read

      - name: Generate dashboard + traffic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/govern.py report
          python3 scripts/govern.py traffic

      # App tokens live one hour and the report can take 45 minutes.
      - name: Mint a fresh token for the PR step
        id: pr-token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Branch ref + commit, then open/reopen the PR and arm auto-merge.
          permission-contents: write
          permission-pull-requests: write

      # main needs a PR with signed commits, so no direct push: commit through
      # createCommitOnBranch (GitHub signs it) and let the PR auto-merge.
      - name: Open PR for the report
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --porcelain --untracked-files=all -- DASHBOARD.md governance-report.json traffic_data/ | cut -c4-)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Report unchanged, nothing to do."
            exit 0
          fi
          printf 'Changed: %s\n' "${files[@]}"

          BRANCH_NAME="governance-report"
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" -F force=true >/dev/null
          else
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" >/dev/null
          fi

          additions=$(for f in "${files[@]}"; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$MAIN_SHA" \
            --arg headline "chore: governance report $(date -u +%Y-%m-%d)" \
            --argjson additions "$additions" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: $additions}
            }}}' | gh api graphql --input -

          # The reset leaves the branch equal to main for a moment, and GitHub can
          # close the open PR then. Reopen it rather than strand the report.
          PR_JSON=$(gh pr list -R "$REPO" --head "$BRANCH_NAME" --state all --limit 1 --json number,state --jq '.[0] // empty')
          PR_NUMBER=$(jq -r '.number // empty' <<<"$PR_JSON")
          PR_STATE=$(jq -r '.state // empty' <<<"$PR_JSON")
          if [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #$PR_NUMBER was closed by the branch reset, reopening it."
            gh pr reopen -R "$REPO" "$PR_NUMBER"
          elif [ "$PR_STATE" != "OPEN" ]; then
            gh pr create -R "$REPO" \
              --title "chore: governance report" \
              --body "Weekly governance report (DASHBOARD.md, governance-report.json, traffic_data/). Auto-merges once the checks pass." \
              --head "$BRANCH_NAME" \
              --base main
          fi

          gh pr merge -R "$REPO" "$BRANCH_NAME" --auto --squash || true

          # Fail the run unless the report is on its way: an open PR with
          # auto-merge armed, or already merged.
          gh pr view -R "$REPO" "$BRANCH_NAME" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" or (.state == "OPEN" and .autoMergeRequest != null) then "report PR: \(.state), auto-merge armed" else error("no open PR with auto-merge for the report (state: \(.state))") end'
