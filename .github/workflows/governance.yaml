name: Governance Report

# Weekly read-only governance pass: regenerate DASHBOARD.md and append traffic
# stats, then commit. Enforcement (settings/rulesets/labels) is NOT here — that
# is declarative Terraform, applied locally.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    # GH_TOKEN for the report is a read-only GitHub App token (below).
    steps:
      # The commit step pushes with this checkout's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # The report covers every repo of the owner, so no repositories list;
          # read-only: administration for traffic, contents and issues for the rest.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-administration: read
          permission-contents: read
          permission-issues: read

      - name: Generate dashboard + traffic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/govern.py report
          python3 scripts/govern.py traffic

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DASHBOARD.md governance-report.json traffic_data/
          git diff --cached --quiet || git commit -m "chore: governance report $(date -u +%Y-%m-%d)"
          git push
