name: Governance Report

# Weekly read-only governance pass: regenerate DASHBOARD.md and append traffic
# stats, then open a PR with them that auto-merges. Enforcement (settings,
# rulesets, labels) is not here: terraform-apply.yaml applies it.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs govern.py with the read-only kleinbem-plan App; no write credentials.
  report:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PLAN_APP_ID }}
          private-key: ${{ secrets.PLAN_APP_PRIVATE_KEY }}
          # The report covers every repo of the owner, so no repositories list.
          # Administration for traffic, actions for workflows, contents and
          # issues for the rest.
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          permission-administration: read
          permission-actions: read
          permission-contents: read
          permission-issues: read

      - name: Generate dashboard + traffic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/govern.py report
          python3 scripts/govern.py traffic

      - name: Collect changed files
        id: changed
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --porcelain --untracked-files=all -- DASHBOARD.md governance-report.json traffic_data/ | cut -c4-)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Report unchanged, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed: %s\n' "${files[@]}"
          mkdir -p out
          cp --parents "${files[@]}" out/
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report
          path: out/
          retention-days: 5
          if-no-files-found: error

  # Opens the report PR with the write App, which only this main-only
  # environment holds (nix/infra github-secrets.tf). Runs no repo code.
  publish:
    needs: report
    if: needs.report.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Download report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: report
          path: out

      - name: Generate GitHub App Token
        id: pr-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Branch ref + commit, then open/reopen the PR and arm auto-merge.
          permission-contents: write
          permission-pull-requests: write

      # main needs a PR with signed commits, so no direct push: commit through
      # createCommitOnBranch (GitHub signs it) and let the PR auto-merge.
      - name: Open PR for the report
        env:
          GH_TOKEN: ${{ steps.pr-token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        working-directory: out
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -printf '%P\n' | sort)
          printf 'Changed: %s\n' "${files[@]}"

          BRANCH_NAME="governance-report"
          # Build on the branch while it exists: an unmerged earlier report (its
          # traffic file) stays, and a failed commit changes nothing. After the
          # merge the branch is deleted, so the next report starts from main.
          if HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH_NAME" --jq .object.sha 2>/dev/null); then
            echo "Adding to $BRANCH_NAME at $HEAD_SHA."
          else
            HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$HEAD_SHA" >/dev/null
          fi

          additions=$(for f in "${files[@]}"; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH_NAME" \
            --arg sha "$HEAD_SHA" \
            --arg headline "chore: governance report $(date -u +%Y-%m-%d)" \
            --argjson additions "$additions" \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $headline},
                expectedHeadOid: $sha,
                fileChanges: {additions: $additions}
            }}}' | gh api graphql --input -

          # Our own branch into main only: a fork PR can use the same head name.
          PR_JSON=$(gh api "repos/$REPO/pulls?head=$OWNER:$BRANCH_NAME&base=main&state=all&sort=created&direction=desc&per_page=1" \
            --jq '.[0] // empty | {number, state, merged: (.merged_at != null)}')
          PR_NUMBER=$(jq -r '.number // empty' <<<"$PR_JSON")
          PR_STATE=$(jq -r 'if . == null or . == "" then "" elif .merged then "merged" else .state end' <<<"${PR_JSON:-null}")
          if [ "$PR_STATE" = closed ]; then
            echo "PR #$PR_NUMBER was closed, reopening it."
            gh pr reopen -R "$REPO" "$PR_NUMBER"
          elif [ "$PR_STATE" != open ]; then
            url=$(gh pr create -R "$REPO" \
              --title "chore: governance report" \
              --body "Weekly governance report (DASHBOARD.md, governance-report.json, traffic_data/). Auto-merges once the checks pass." \
              --head "$BRANCH_NAME" \
              --base main)
            PR_NUMBER=${url##*/}
          fi

          # Errors here are checked below instead: arming auto-merge on a PR that
          # already merged fails, and that case is fine.
          gh pr merge -R "$REPO" "$PR_NUMBER" --auto --squash || true

          # Fail the run unless the report is on its way: an open PR with
          # auto-merge armed, or already merged.
          gh pr view -R "$REPO" "$PR_NUMBER" --json state,autoMergeRequest \
            --jq 'if .state == "MERGED" or (.state == "OPEN" and .autoMergeRequest != null) then "report PR: \(.state), auto-merge armed" else error("no open PR with auto-merge for the report (state: \(.state))") end'
